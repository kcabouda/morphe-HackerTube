name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Seed baseline tag
        # The fork has no tags. Mark the upstream v2.0.0 commit we forked from,
        # so the first release only lists our own changes.
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            out=$(git tag v2.0.0 0bb704a9a4edb5324f6e607f3fc5a531713c607c 2>&1 && git push origin v2.0.0 2>&1) \
              || { echo "::error title=Seed baseline tag::$(echo "$out" | tr '\n' ' ')"; exit 1; }
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
