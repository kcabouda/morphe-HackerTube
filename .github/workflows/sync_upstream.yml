name: Sync upstream Morphe patches

# Merges MorpheApp/morphe-patches main into this fork once a day,
# then starts a release so Morphe Manager picks up the update.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Merge upstream
    permissions:
      contents: write
      actions: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MorpheApp/morphe-patches.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-ff --no-edit -m "chore: Merge upstream Morphe patches" upstream/main; then
            # Files generated by our own releases: always keep ours.
            for f in CHANGELOG.md README.md gradle.properties patches-bundle.json patches-list.json; do
              if git diff --name-only --diff-filter=U | grep -qx "$f"; then
                git checkout --ours -- "$f"
                git add -- "$f"
              fi
            done
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Conflicts need a human:"
              git diff --name-only --diff-filter=U
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --no-edit -m "chore: Merge upstream Morphe patches"
          fi

          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start release
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main

      - name: Report conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream sync needs a manual merge ($(date -u +%F))" \
            --body "The daily merge of MorpheApp/morphe-patches hit conflicts outside the generated files. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
